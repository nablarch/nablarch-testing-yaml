setup_tables:
  - table: TEST_TABLE
    rows:
      - PK_COL1: "0000000001"
        PK_COL2: "AB"
        VARCHAR2_COL: "あいうえお"
        NUMBER_COL: "1"
        NUMBER_COL2: "1.1"

  - group_id: groupA
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000002"
        PK_COL2: "CD"
        VARCHAR2_COL: "かきくけこ"
        NUMBER_COL: "2"
        NUMBER_COL2: "2.2"

  - group_id: emptyRows
    table: TEST_TABLE
    rows: []

  - group_id: dupTable
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000010"
        PK_COL2: "EF"
        VARCHAR2_COL: "さしすせそ"
        NUMBER_COL: "10"
        NUMBER_COL2: "10.1"

  - group_id: dupTable
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000011"
        PK_COL2: "GH"
        VARCHAR2_COL: "たちつてと"
        NUMBER_COL: "11"
        NUMBER_COL2: "11.1"

  - group_id: missingTable
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000099"
        PK_COL2: "XX"

  - group_id: markerColInTable
    table: TEST_TABLE
    rows:
      - "[NO]": "1"
        PK_COL1: "0000000001"
        PK_COL2: "AB"
        VARCHAR2_COL: "test"
        NUMBER_COL: "1"
        NUMBER_COL2: "1.1"

  - group_id: allEmptyRows
    table: TEST_TABLE
    rows:
      - {}
      - {}

  - group_id: emptyRowMixed
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000020"
        PK_COL2: "AA"
        VARCHAR2_COL: "first"
        NUMBER_COL: "20"
        NUMBER_COL2: "20.0"
      - {}
      - PK_COL1: "0000000021"
        PK_COL2: "BB"
        VARCHAR2_COL: "third"
        NUMBER_COL: "21"
        NUMBER_COL2: "21.0"

  # 先頭の非空行が列名を決めることを固定するため、2 行目と 3 行目でキー集合を変えてある。
  - group_id: leadingEmptyRow
    table: TEST_TABLE
    rows:
      - {}
      - PK_COL1: "0000000030"
        PK_COL2: "CC"
        VARCHAR2_COL: "second"
        NUMBER_COL: "30"
        NUMBER_COL2: "30.0"
      - PK_COL1: "0000000031"
        PK_COL2: "DD"
        VARCHAR2_COL: "third"


  # 全ての値が null または空文字の行は行として存在しないものとして扱われる（先頭に置いた場合）。
  # 列名解決からも除外されることを固定するため、空行のキー集合を後続行と変えてある。
  - group_id: blankValueRowLeading
    table: TEST_TABLE
    rows:
      - PK_COL1: ""
        VARCHAR2_COL: null
      - PK_COL1: "0000000050"
        PK_COL2: "GG"
        VARCHAR2_COL: "leading"
        NUMBER_COL: "50"
        NUMBER_COL2: "50.0"

  # 全ての値が null または空文字の行は行として存在しないものとして扱われる（中間に置いた場合）。
  - group_id: blankValueRowMiddle
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000051"
        PK_COL2: "HH"
        VARCHAR2_COL: "first"
        NUMBER_COL: "51"
        NUMBER_COL2: "51.0"
      - PK_COL1: ""
        PK_COL2: null
        VARCHAR2_COL: ""
        NUMBER_COL: null
        NUMBER_COL2: ""
      - PK_COL1: "0000000052"
        PK_COL2: "II"
        VARCHAR2_COL: "third"
        NUMBER_COL: "52"
        NUMBER_COL2: "52.0"

  # 値が 1 つでも非空なら行として保持される（他は null／空文字）。
  - group_id: partiallyBlankValueRow
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000053"
        PK_COL2: "JJ"
        VARCHAR2_COL: ""
        NUMBER_COL: null
        NUMBER_COL2: ""
      - PK_COL1: ""
        PK_COL2: null
        VARCHAR2_COL: ""
        NUMBER_COL: null
        NUMBER_COL2: ""

  # 空行判定は値加工（interpret）より前に行うため、値加工を通すと全ての値が Java null になる行も
  # 行として保持される。クォートあり "null" は NullInterpreter が Java null へ変換する。
  # 判定を値加工の後ろへずらすとこの行が消えるので、順序を固定するための門番になる。
  - group_id: interpretedToNullRow
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000054"
        PK_COL2: "PP"
        VARCHAR2_COL: "kept"
      - PK_COL1: "null"
        PK_COL2: "null"
        VARCHAR2_COL: "null"


list_maps:
  - id: testListMap
    rows:
      - KEY1: "val1"
        KEY2: "val2"
      - KEY1: "val3"
        KEY2: "val4"

  - id: markerColTest
    rows:
      - "[NO]": "1"
        KEY1: "val1"
        KEY2: "val2"

  - id: dupIdFirst
    rows:
      - KEY1: "first"

  - id: dupIdFirst
    rows:
      - KEY1: "second"

  - id: testShots
    rows:
      - no: "1"
        description: "ケース1"
        expectedStatusCode: "200"
        setUpTable: ""
        expectedTable: ""
      - no: "2"
        description: "ケース2"
        expectedStatusCode: "400"
        setUpTable: "case2"
        expectedTable: "case2"

  - id: nonMapRowTest
    rows:
      - KEY1: "valid"
      - KEY1: "also_valid"

  - id: partialBracketColTest
    rows:
      - "[OPEN": "ignored_val"
        KEY1: "real_val"

  - id: emptyRowListMap
    rows:
      - KEY1: "before"
      - {}
      - KEY1: "after"

  # 先頭の非空行が列名を決めることを固定するため、2 行目と 3 行目でキー集合を変えてある。
  - id: leadingEmptyRowListMap
    rows:
      - {}
      - KEY1: "second"
        KEY2: "val2"
      - KEY1: "third"

  # 全ての値が null または空文字の行は行として存在しないものとして扱われる（先頭に置いた場合）。
  # 列名解決からも除外されることを固定するため、空行のキー集合を後続行と変えてある。
  - id: blankValueRowLeadingListMap
    rows:
      - KEY9: ""
        KEY8: null
      - KEY1: "second"
        KEY2: "val2"

  # 全ての値が null または空文字の行は行として存在しないものとして扱われる（中間に置いた場合）。
  - id: blankValueRowMiddleListMap
    rows:
      - KEY1: "before"
        KEY2: "val1"
      - KEY1: ""
        KEY2: null
      - KEY1: "after"
        KEY2: "val2"

  # 値が 1 つでも非空なら行として保持される（他は null／空文字）。
  - id: partiallyBlankValueRowListMap
    rows:
      - KEY1: "kept"
        KEY2: ""
        KEY3: null
      - KEY1: ""
        KEY2: null
        KEY3: ""

  # 空行判定は値加工（interpret）より前に行うため、値加工を通すと全ての値が Java null になる行も
  # 行として保持される（setup_tables 側の interpretedToNullRow と同じ趣旨で list_maps 経路を固定する）。
  - id: interpretedToNullRowListMap
    rows:
      - KEY1: "kept"
        KEY2: "val"
      - KEY1: "null"
        KEY2: "null"


expected_tables:
  - group_id: markerColInTable
    table: TEST_TABLE
    rows:
      - "[NO]": "1"
        PK_COL1: "0000000001"
        PK_COL2: "AB"
        VARCHAR2_COL: "test"
        NUMBER_COL: "1"
        NUMBER_COL2: "1.1"

  - group_id: newGroup_emptyExpected
    table: TEST_TABLE
    rows: []

  # 先頭の非空行が列名を決めることを固定するため、2 行目と 3 行目でキー集合を変えてある。
  - group_id: leadingEmptyRowExpected
    table: TEST_TABLE
    rows:
      - {}
      - PK_COL1: "0000000040"
        PK_COL2: "EE"
        VARCHAR2_COL: "expected"
        NUMBER_COL: "40"
        NUMBER_COL2: "40.0"
      - PK_COL1: "0000000041"
        PK_COL2: "FF"
        VARCHAR2_COL: "expected2"


  # 空マッピング（{}）の行は中間に置いても行として存在しないものとして扱われる。
  - group_id: emptyRowMixedExpected
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000060"
        PK_COL2: "KK"
        VARCHAR2_COL: "first"
        NUMBER_COL: "60"
        NUMBER_COL2: "60.0"
      - {}
      - PK_COL1: "0000000061"
        PK_COL2: "LL"
        VARCHAR2_COL: "third"
        NUMBER_COL: "61"
        NUMBER_COL2: "61.0"

  # 全ての値が null または空文字の行は行として存在しないものとして扱われる（先頭に置いた場合）。
  # 列名解決からも除外されることを固定するため、空行のキー集合を後続行と変えてある。
  - group_id: blankValueRowLeadingExpected
    table: TEST_TABLE
    rows:
      - PK_COL1: ""
        VARCHAR2_COL: null
      - PK_COL1: "0000000062"
        PK_COL2: "MM"
        VARCHAR2_COL: "leading"
        NUMBER_COL: "62"
        NUMBER_COL2: "62.0"

  # 全ての値が null または空文字の行は行として存在しないものとして扱われる（中間に置いた場合）。
  - group_id: blankValueRowMiddleExpected
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000063"
        PK_COL2: "NN"
        VARCHAR2_COL: "first"
        NUMBER_COL: "63"
        NUMBER_COL2: "63.0"
      - PK_COL1: ""
        PK_COL2: null
        VARCHAR2_COL: ""
        NUMBER_COL: null
        NUMBER_COL2: ""
      - PK_COL1: "0000000064"
        PK_COL2: "OO"
        VARCHAR2_COL: "third"
        NUMBER_COL: "64"
        NUMBER_COL2: "64.0"
