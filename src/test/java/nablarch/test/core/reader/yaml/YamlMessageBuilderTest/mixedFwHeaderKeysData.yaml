# 同一ファイルに「不正キーのエントリ」と「正常エントリ」を同居させたフィクスチャ。
# fw_header: のキー検査が、実際に読み出すエントリに対してのみ遅延実行されること
# （誤記エントリが他エントリの読み出しを巻き添えにしないこと）を検証する。
# fw_header に記載できるキーは reader.fwHeaderfields の名前
# （省略時は requestId・userId・resendFlag・resultCode）だけであり、それ以外のキーがあるとエラーになる。
#
# 不正キーの境界値（大文字小文字違い・~・数値・真偽値）も、実 YAML から到達できるものはこのファイルで押さえる。
#
# 【前提】このフィクスチャが「巻き添えにしない」ことを示せるのは、スキーマ $defs.fw_header が
# additionalProperties: {"type":"string"} で値の型だけを縛りキー名を制限していないからである。
# キー名を制限すると badKey001 を含むこのファイルはロード時に全体が落ち、遅延実行の性質を示せなくなる。

messages:
  # 不正キー（既定 4 つにも無い customField）を持つエントリ
  - id: badKey001
    fw_header:
      customField: "CUSTOM_VALUE"
    records:
      - record_type: BODY
        fields:
          - name: DATA
            type: 半角
            length: 5
        rows:
          - ["HELLO"]

  # YAML の ~ を素で書いたエントリ。~ は null キーではなく文字列 "~" として読み込まれる
  # （実 YAML から到達可能な不正キーの実例）。
  - id: tildeKey001
    fw_header:
      ~: "TILDE_VALUE"
    records:
      - record_type: BODY
        fields:
          - name: DATA
            type: 半角
            length: 5
        rows:
          - ["TILDE"]

  # 既定キーだけを持つ正常エントリ
  - id: goodKey001
    fw_header:
      requestId: "0000000001"
      userId: "testUser01"
    records:
      - record_type: BODY
        fields:
          - name: DATA
            type: 半角
            length: 5
        rows:
          - ["WORLD"]

  # 既定キー requestId と大文字小文字だけが違うキー（キーの照合が大文字小文字を区別することの実例）
  - id: lowerCaseKey001
    fw_header:
      requestid: "0000000001"
    records:
      - record_type: BODY
        fields:
          - name: DATA
            type: 半角
            length: 5
        rows:
          - ["HELLO"]

  - id: upperCaseKey001
    fw_header:
      REQUESTID: "0000000001"
    records:
      - record_type: BODY
        fields:
          - name: DATA
            type: 半角
            length: 5
        rows:
          - ["HELLO"]

  # クォートなしの数値・真偽値をキーに書いたエントリ。Jackson の valueToTree が JSON 化の際に
  # キーを文字列にするためスキーマ（$defs.fw_header）は通り、convertFwHeader には
  # java.lang.Integer / java.lang.Boolean のまま届く（＝文字列でないキーも実 YAML から到達可能）。
  - id: numericKey001
    fw_header:
      1234: "VALUE"
    records:
      - record_type: BODY
        fields:
          - name: DATA
            type: 半角
            length: 5
        rows:
          - ["HELLO"]

  - id: booleanKey001
    fw_header:
      true: "VALUE"
    records:
      - record_type: BODY
        fields:
          - name: DATA
            type: 半角
            length: 5
        rows:
          - ["HELLO"]
