setup_files:
  - path: dummy/setup_fixed.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
            length: 5
          - name: FIELD2
            type: 半角
            length: 5
        rows:
          - ["AAAAA", "BBBBB"]

  - group_id: grp1
    path: dummy/setup_fixed_grp.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
            length: 3
        rows:
          - ["AAA"]

  - path: dummy/setup_variable.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: NAME
            type: 半角
          - name: VALUE
            type: 半角
        rows:
          - ["田中", "100"]

  - group_id: missingPath
    path: dummy/missing_path.dat
    type: fixed
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
            length: 5
        rows:
          - ["HELLO"]

  - group_id: noRecordType
    path: dummy/no_record_type.dat
    type: fixed
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
            length: 5
        rows:
          - ["HELLO"]

  - group_id: multiRecord
    path: input/multi.dat
    type: fixed
    records:
      # 固定長ファイルは全レコードレイアウトのレコード長が一致している必要があるため、
      # HEADER は FILLER でレコード長を DATA と同じ 40 バイトに揃える。
      - record_type: HEADER
        fields:
          - name: SEQ
            type: 半角
            length: 4
          - name: TYPE
            type: 半角
            length: 2
          - name: FILLER
            type: 半角
            length: 34
        rows:
          - ["H001", "01", ""]
      - record_type: DATA
        fields:
          - name: USER_ID
            type: 半角
            length: 10
          - name: AMOUNT
            type: 数値
            length: 10
          - name: NOTE
            type: 全角
            length: 20
        rows:
          - ["001", "5000", "備考"]

  - group_id: emptyFile
    path: input/empty.dat
    type: fixed
    directives:
      text-encoding: MS932
    records: []

  # 通常ファイル経路では record_type の値がそのままレコード種別名になる（メッセージ系は "default" 固定）。
  # "FW_HEADER" は予約値ではないため、この経路では普通の文字列として扱われる。
  - group_id: fwHeaderRecordTypeInFile
    path: input/fw_header_record_type.dat
    type: fixed
    directives:
      text-encoding: MS932
    records:
      - record_type: FW_HEADER
        fields:
          - name: HEAD_KEY
            type: 半角
            length: 10
        rows:
          - ["HEADKEY001"]
      - record_type: DATA
        fields:
          - name: BODY_KEY
            type: 半角
            length: 10
        rows:
          - ["BODYKEY001"]

expected_files:
  - path: dummy/expected_fixed.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: RESULT
        fields:
          - name: CODE
            type: 半角
            length: 4
          - name: MSG
            type: 半角
            length: 4
        rows:
          - ["0000", "OKAY"]

  - path: dummy/expected_variable.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: NAME
            type: 半角
          - name: VALUE
            type: 半角
        rows:
          - ["鈴木", "200"]

  - group_id: twoCharSeparator
    path: dummy/two_char.csv
    type: variable
    directives:
      field-separator: ",,"
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
        rows:
          - ["A"]

  - group_id: tabSeparator
    path: dummy/tab_separated.tsv
    type: variable
    directives:
      field-separator: "\\t"
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
          - name: FIELD2
            type: 半角
        rows:
          - ["A", "B"]

  - group_id: duplicateFixedName
    path: dummy/dup_fixed.dat
    type: fixed
    directives:
      text-encoding: MS932
    records:
      - record_type: DATA
        fields:
          - name: dup
            type: 半角
            length: 5
          - name: dup
            type: 半角
            length: 5
        rows:
          - ["AAAAA", "BBBBB"]

  - group_id: duplicateVariableName
    path: dummy/dup_variable.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: dup
            type: 半角
          - name: dup
            type: 半角
        rows:
          - ["AAA", "BBB"]

  # record-separator のシンボル指定（NONE / CR / LF / CRLF の4種）。
  - group_id: symbolRecordSeparatorNone
    path: dummy/symbol_record_separator_none.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
      record-separator: NONE
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
        rows:
          - ["A"]

  - group_id: symbolRecordSeparatorCr
    path: dummy/symbol_record_separator_cr.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
      record-separator: CR
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
        rows:
          - ["A"]

  - group_id: symbolRecordSeparatorLf
    path: dummy/symbol_record_separator_lf.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
      record-separator: LF
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
        rows:
          - ["A"]

  - group_id: symbolRecordSeparatorCrlf
    path: dummy/symbol_record_separator_crlf.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
      record-separator: CRLF
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
        rows:
          - ["A"]

  # シンボルのいずれにも合致しない文字列（それ自身が区切り文字になる）。
  - group_id: literalRecordSeparator
    path: dummy/literal_record_separator.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
      record-separator: ":"
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
        rows:
          - ["A"]

  # YAML のダブルクォート文字列内エスケープシーケンスは、実際の制御文字 CR+LF へ展開される。
  # 以下の record-separator の値は「実 CR + 実 LF の 2 文字」であって "\r\n" という 4 文字ではない。
  - group_id: controlCharRecordSeparator
    path: dummy/control_char_record_separator.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
      record-separator: "\r\n"
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
        rows:
          - ["A"]

  # 以下の field-separator の値は「実タブ文字 1 文字（U+0009）」であって "\t" という 2 文字ではない。
  - group_id: controlCharFieldSeparator
    path: dummy/control_char_field_separator.tsv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: "\t"
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
        rows:
          - ["A"]

  # ファイルデータには「全ての値が空なら行を落とす」規則を適用しない（テーブル系・list_maps のみ）。
  # 全フィールドが "" のレコードも 1 件のレコードとして保持されることを固定する。
  - group_id: allBlankFieldsRecord
    path: dummy/all_blank_fields.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
          - name: FIELD2
            type: 半角
          - name: FIELD3
            type: 半角
        rows:
          - ["", "", ""]

  # JSON スキーマ $defs.record_fragment.properties.rows.description が述べる挙動の固定用。
  # 可変長（VariableLengthFile）を使う。可変長は DataRecord への変換が恒等写像のため、
  # DataFileFragment が値行に詰めた文字列がそのまま DataRecord の値になる。
  # emptyRow は「要素数 0 の配列」を固定する。空文字を要素数ぶん明示的に並べた側は
  # 上の allBlankFieldsRecord が担う。
  - group_id: shortRow
    path: dummy/short_row.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
          - name: FIELD2
            type: 半角
          - name: FIELD3
            type: 半角
        rows:
          - ["AAAAA"]

  - group_id: emptyRow
    path: dummy/empty_row.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
          - name: FIELD2
            type: 半角
        rows:
          - []

  - group_id: noRows
    path: dummy/no_rows.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
          - name: FIELD2
            type: 半角
        rows: []
