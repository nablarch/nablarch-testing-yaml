# 末尾フィールドの null の扱いを本体（Excel 経路）と突き合わせるための YAML 側入力。
#
# 本体側の同じ意味の入力は YamlTrailingNullOracleTest#buildOracleBook が POI で組み立てる。
# ケース名（F1〜F6・M1・S2）は Excel 側のシート名と一致しており、1 対 1 に対応する。
#
#   F1 ["x", null, null]  <-> セル | x  | null | null |
#   F2 ["x", null, "y"]   <-> セル | x  | null | y    |
#   F3 [""]               <-> セル | "" | （空） | （空） |
#   F4 [null, null, null] <-> セル | null | null | null |
#   F5 ["x"]              <-> セル | x  | （空） | （空） |
#   F6 ["x", "", null]    <-> セル | x  | ""   | null |
#   M1 ["x", null, null]  <-> セル | x  | null | null |（電文）
#   S2 ["x", null, null]  <-> セル | x  | null | null |（送信同期電文。Excel には先頭に連番セルがある）
#
# ファイルデータは可変長（VariableLengthFile）を使う。可変長は DataRecord への変換が恒等写像
# （VariableLengthFileFragment#convertValue が引数をそのまま返す）であり、値行に詰まった
# "" と null をそのまま観測できるためである。

setup_files:
  # F1: 末尾 2 フィールドが null。本体では両方 "" に畳まれる。
  - group_id: F1
    path: dummy/f1.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
          - name: FIELD2
            type: 半角
          - name: FIELD3
            type: 半角
        rows:
          - ["x", null, null]

  # F2: null の後ろに値のあるフィールドがある。null のまま保持される。
  - group_id: F2
    path: dummy/f2.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
          - name: FIELD2
            type: 半角
          - name: FIELD3
            type: 半角
        rows:
          - ["x", null, "y"]

  # F3: 先頭が空文字で、後続フィールドの値を書かない。
  #     本体では「空セル」でも「""」でも同じ結果（全フィールド ""）になる。
  - group_id: F3
    path: dummy/f3.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
          - name: FIELD2
            type: 半角
          - name: FIELD3
            type: 半角
        rows:
          - [""]

  # F4: 全フィールドが null。本体では全フィールドが "" になる。
  - group_id: F4
    path: dummy/f4.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
          - name: FIELD2
            type: 半角
          - name: FIELD3
            type: 半角
        rows:
          - [null, null, null]

  # F5: 後続フィールドの値を書かない（要素数が fields に満たない）。
  - group_id: F5
    path: dummy/f5.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
          - name: FIELD2
            type: 半角
          - name: FIELD3
            type: 半角
        rows:
          - ["x"]

  # F6: 空文字を挟んだ末尾の null。空文字も null も末尾側から畳まれる。
  - group_id: F6
    path: dummy/f6.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
          - name: FIELD2
            type: 半角
          - name: FIELD3
            type: 半角
        rows:
          - ["x", "", null]

messages:
  # M1: 電文（MESSAGE）のデータ行。ファイルデータと同じ扱いになる。
  - id: M1
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: BODY
        fields:
          - name: FIELD1
            type: 半角
            length: 5
          - name: FIELD2
            type: 半角
            length: 5
          - name: FIELD3
            type: 半角
            length: 5
        rows:
          - ["x", null, null]

response_body_messages:
  # S2: 送信同期電文（RESPONSE_BODY_MESSAGES）のデータ行。
  #     本体の Excel では値行の先頭セルが連番（No 列）であり、値の並びは 2 列目以降になる。
  - group_id: S2
    id: s2
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: BODY
        fields:
          - name: FIELD1
            type: 半角
            length: 5
          - name: FIELD2
            type: 半角
            length: 5
          - name: FIELD3
            type: 半角
            length: 5
        rows:
          - ["x", null, null]
