# 取引単体テストのモックアップクラスが読む同期応答メッセージ送信のテストデータ。
# YAML 形式ではリクエスト ID と同じ名前のディレクトリ配下の message.yaml が読み込み単位になる
# （message は固定の名前）。
# 出典: implementation/deal_unit_test/mom.rst:72, implementation/testdata_notation.rst:1151
response_body_messages:
  - id: RM21AA0101
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: BODY
        fields:
          - name: RESULT_KEY
            type: 半角
            length: 10
        rows:
          - ["FROM_DIR01"]
